<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>字体实测：汇文明朝体 × 霞鹜文楷</title>
<!-- 新字体加载（中文网字计划 / jsDelivr CDN） -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/npm/@chinese-fonts/hwmct@3.0.0/dist/汇文明朝体/result.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@chinese-fonts/lxgwwenkai@3.0.0/dist/LXGWWenKai-Regular/result.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@chinese-fonts/lxgwwenkai@3.0.0/dist/LXGWWenKai-Medium/result.css" rel="stylesheet">
<style>
:root {
  --card-w: 1080px; --card-h: 1440px; --u: 1;
  --pad: calc(96px * var(--u));
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #555; }
body.multi { display: flex; flex-direction: column; align-items: center; gap: 48px; padding: 48px 0; }
body.single { background: transparent; }
body.single .card { display: none; }
body.single .card.active { display: flex; }

.card {
  width: var(--card-w); height: var(--card-h);
  position: relative; overflow: hidden;
  display: flex; flex-direction: column;
}
.pad { padding: var(--pad); flex: 1; display: flex; flex-direction: column; }
.card-foot { display: flex; justify-content: space-between; align-items: center; padding: calc(36px * var(--u)) var(--pad) calc(52px * var(--u)); }

/* ===== 卡1：汇文明朝体（旧铅字明朝体）===== */
.c1 { background: #F5F1E6; color: #211D16; }
.c1 .kicker { font-family: "Huiwen-mincho", "Noto Serif SC", serif; font-size: calc(28px * var(--u)); letter-spacing: 0.35em; color: #8A7B5C; }
.c1 h1 {
  font-family: "Huiwen-mincho", "Noto Serif SC", serif;
  font-weight: 400;
  font-size: calc(112px * var(--u)); line-height: 1.3;
  margin-top: calc(64px * var(--u));
}
.c1 .body { font-family: "Huiwen-mincho", "Noto Serif SC", serif; font-size: calc(38px * var(--u)); line-height: 1.85; margin-top: calc(72px * var(--u)); color: #4A4234; }
.c1 .rule { width: calc(180px * var(--u)); height: 2px; background: #C7B088; margin-top: calc(64px * var(--u)); }
.c1 .meta { font-family: "Huiwen-mincho", serif; font-size: calc(25px * var(--u)); color: #8A7B5C; }

/* ===== 卡2：霞鹜文楷（楷体）===== */
.c2 { background: #2A3142; color: #EFE9DC; }
.c2 .kicker { font-family: "LXGW WenKai", "Noto Serif SC", serif; font-size: calc(28px * var(--u)); letter-spacing: 0.35em; color: #C8A870; }
.c2 h1 {
  font-family: "LXGW WenKai", "Noto Serif SC", serif;
  font-weight: 500;
  font-size: calc(112px * var(--u)); line-height: 1.3;
  margin-top: calc(64px * var(--u));
}
.c2 .body { font-family: "LXGW WenKai", "Noto Serif SC", serif; font-size: calc(38px * var(--u)); line-height: 1.85; margin-top: calc(72px * var(--u)); color: #C9C2B4; }
.c2 .rule { width: calc(180px * var(--u)); height: 2px; background: #C8A870; margin-top: calc(64px * var(--u)); }
.c2 .meta { font-family: "LXGW WenKai", serif; font-size: calc(25px * var(--u)); color: #9A917E; }

.em { color: #B0483C; }
</style>
</head>
<body class="multi">

  <!-- 卡 1 · 汇文明朝体 -->
  <section class="card c1" data-index="1">
    <div class="pad">
      <div class="kicker">HUIWEN MINCHO · 汇文明朝体</div>
      <h1>夜深人静时，<br>文字该有它<br><span class="em">本来的样子</span></h1>
      <div class="rule"></div>
      <p class="body">字形来源主体為五六十年代官方各种汉字改革文件，简体字部分基本复原汉字简化后、字形改造前的书籍印刷体樣貌。</p>
    </div>
    <div class="card-foot">
      <span class="meta">旧铅字印刷风格 · 作者声明免费商用</span>
      <span class="meta">01 / 02</span>
    </div>
  </section>

  <!-- 卡 2 · 霞鹜文楷 -->
  <section class="card c2" data-index="2">
    <div class="pad">
      <div class="kicker">LXGW WENKAI · 霞鹜文楷</div>
      <h1>夜深人静时，<br>文字该有它<br><span class="em" style="color:#E8C87A;">本来的样子</span></h1>
      <div class="rule"></div>
      <p class="body">基于 Klee One 改造而来，兼具书法笔触的温度与现代数字排版的规整，是开源楷体里流传最广的一款。</p>
    </div>
    <div class="card-foot">
      <span class="meta">开源楷体 · SIL OFL 1.1</span>
      <span class="meta">02 / 02</span>
    </div>
  </section>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var n = parseInt(params.get('p'), 10);
  if (n > 0) {
    document.body.className = 'single';
    var t = document.querySelector('.card[data-index="' + n + '"]');
    if (t) t.classList.add('active');
  }
})();
</script>
</body>
</html>
